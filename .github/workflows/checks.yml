name: DALIA checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dalia_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dalia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dalia_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://dalia_test:ci-only-password@localhost:5432/dalia_test
      TEST_DATABASE_URL: postgresql+asyncpg://dalia_test:ci-only-password@localhost:5432/dalia_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest tests/unit tests/integration -q
      - run: python -m pip_audit -r requirements.txt
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo test --locked
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
